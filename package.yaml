name:                parse-genbank
version:             0.1.0.0
github:              "githubuser/parse-genbank"
license:             LGPL-3.0
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/parse-genbank#readme>

dependencies:
- base >= 4.7 && < 5
- hspec
- text
- containers
- filepath
- hspec-megaparsec
- megaparsec
- optparse-applicative
- string-interpolate


ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  parse-genbank:
    main:                Main.hs
    source-dirs:         app
    ghc-options: []
    dependencies:
    - parse-genbank

tests:
  parse-genbank-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - parse-genbank
